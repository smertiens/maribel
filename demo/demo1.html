<!DOCTYPE html>
<html lang="de-DE">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Maribel Demo 1</title>

        <script src="../dist/maribel.js"></script>
    </head>
    <body>
        <h1>Maribel Demo</h1>

        <button onclick="mar.d.showParagraph.value = ! mar.d.showParagraph.value">Toggle Paragraph</button>
        <div style="background-color: darkkhaki; border: 1px solid black; padding: 5px;" id="p1">
            Click the button above!
        </div>

        <form onsubmit="return false">
            <div>
                <input type="text" name="foo" />
                <button onclick="mar.d.foo.value = 'clicked'">Fill</button>
            </div>
            <div>
                <input type="text" id="bar" />
            </div>
        </form>

        <div id="apiResult" @style="'background-color: ' + foo.value">
            No api call yet: [[ foo.value ]], [[ 1+1 ]] and also [[ showParagraph.value ]]
        </div>
        <script>
            const mar = Maribel.create();

            const d = mar.data({
                showParagraph: mar.statefulValue(true),
                foo: mar.bind('foo')
            })

            mar.on('ready', async () => {
                
            });

            mar.on('state:changed', () => {
                d.showParagraph.value ? mar.dom.show('p1') : mar.dom.hide('p1');
            });
        </script>

    </body>
</html>
